# EASM Agent on Kubernetes (GKE, AKS, EKS or any conformant cluster). See docs/KUBERNETES.md.
#
#   kubectl create namespace easm
#   kubectl -n easm create secret generic easm-key-passphrase --from-file=passphrase=./passphrase.txt
#   kubectl apply -k deploy/kubernetes
#
# The image is pinned to a release by digest below (the digest wins over the tag, which is kept
# for readers). After a release, set both from the release run's "Container image" job.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: easm
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - service.yaml
  - statefulset.yaml
  - networkpolicy.yaml
images:
  - name: easm-agent
    newName: ghcr.io/cyberjangle101/easm-agent
    newTag: "1.9.16"
    digest: sha256:4fab08384da8d11f8f5be354aece3e5c3f7d6558534d80d0995ce792596b065f
labels:
  - pairs:
      app.kubernetes.io/name: easm-agent
      app.kubernetes.io/part-of: easm
    includeSelectors: false
