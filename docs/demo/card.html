<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CyberSoar EASM demo card</title>
<!-- A title card for the demo video, rendered by tools/democap: card.html#t=Title&s=Subtitle&k=kicker -->
<style>
  html, body { margin: 0; height: 100%; }
  body { display: grid; place-items: center; background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 55%, #4338ca 100%);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; color: #fff; }
  main { max-width: 1100px; padding: 0 60px; text-align: center; }
  .logo { width: 104px; height: 104px; margin-bottom: 30px; border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  .k { text-transform: uppercase; letter-spacing: .18em; font-size: 20px; font-weight: 700; color: #93c5fd; margin: 0 0 18px; }
  h1 { font-size: 68px; line-height: 1.08; margin: 0 0 26px; letter-spacing: -.02em; }
  p { font-size: 30px; line-height: 1.4; color: #dbeafe; margin: 0; }
  .url[hidden] { display: none; }
  .url { margin-top: 38px; display: inline-block; font-size: 24px; padding: 12px 22px; border-radius: 12px; background: rgba(255,255,255,.12); color: #fff; }
</style>
</head>
<body>
<main>
  <img class="logo" src="../../web/static/logo.png" alt="">
  <p class="k" id="k"></p>
  <h1 id="t"></h1>
  <p id="s"></p>
  <div class="url" id="u" hidden></div>
</main>
<script>
  // Each card is this file with its text in the fragment; a new fragment does not reload the page.
  function render() {
    const q = new URLSearchParams(location.hash.slice(1));
    for (const id of ["k", "t", "s"]) document.getElementById(id).textContent = q.get(id) || "";
    const u = document.getElementById("u");
    u.textContent = q.get("u") || "";
    u.hidden = !q.get("u");
  }
  render();
  addEventListener("hashchange", render);
</script>
</body>
</html>
